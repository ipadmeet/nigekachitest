<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini HTML IDE</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:#fff;
}

.toolbar{
height:60px;
display:flex;
align-items:center;
padding:12px;
border-bottom:1px solid #ddd;
gap:20px;
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
background:#007aff;
color:#fff;
cursor:pointer;
}

input{
padding:10px;
border:1px solid #ccc;
border-radius:10px;
}

.main{
flex:1;
display:flex;
overflow:hidden;
}

.panel{
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
}

.chat{width:30%;}
.editor{width:35%;}
.preview{width:35%;}

.messages{
flex:1;
overflow:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:12px;
}

.msg{
padding:12px;
border-radius:14px;
max-width:80%;
}

.user{
background:#007aff;
color:#fff;
align-self:flex-end;
}

.ai{
background:#eee;
align-self:flex-start;
}

textarea{
flex:1;
border:none;
outline:none;
padding:20px;
font-family:monospace;
font-size:14px;
resize:none;
}

iframe{
width:100%;
height:100%;
border:none;
}

.bottom{
padding:12px;
border-top:1px solid #ddd;
display:flex;
gap:10px;
}
</style>
</head>

<body>

<div class="toolbar">
<input id="apikey" placeholder="Gemini API Key" style="width:250px;">
<button onclick="saveKey()">保存</button>

<div style="flex:1;text-align:center;">
<button onclick="resetApp()">リセット</button>
<button onclick="undo()">戻る</button>
<button onclick="redo()">進む</button>
</div>

<button onclick="shareHTML()">共有</button>
</div>

<div class="main">

<div class="panel chat">
<div class="messages" id="messages"></div>

<div class="bottom">
<input id="chatInput" placeholder="Geminiへ指示" style="flex:1;">
<button onclick="sendToGemini()">送信</button>
</div>
</div>

<div class="panel editor">
<textarea id="editor"></textarea>
</div>

<div class="panel preview">
<iframe id="preview"></iframe>
</div>

</div>

<script>

let apiKey = localStorage.getItem("gemini_api_key") || "";
let chat = JSON.parse(localStorage.getItem("chat") || "[]");

let history = [];
let historyIndex = -1;

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const messages = document.getElementById("messages");
const apikeyInput = document.getElementById("apikey"); // 共通変数として取得

const defaultHTML = `<!DOCTYPE html>
<html>
<body style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:-apple-system;
font-size:48px;
font-weight:bold;
">
Hello, World!
</body>
</html>`;

apikeyInput.value = apiKey;
editor.value = localStorage.getItem("html") || defaultHTML;

renderPreview();
renderChat();
saveHistory();

// 【追加】キーボードで入力・貼り付けした瞬間に自動でLocalStorageに保存する処理
apikeyInput.addEventListener("input", () => {
    apiKey = apikeyInput.value.trim();
    localStorage.setItem("gemini_api_key", apiKey);
});

function saveKey(){
apiKey = apikeyInput.value.trim();

if(!apiKey){
alert("APIキーを入力してください");
return;
}

localStorage.setItem("gemini_api_key", apiKey);
alert("APIキー保存しました");
}

function renderPreview(){
preview.srcdoc = editor.value;
localStorage.setItem("html", editor.value);
}

editor.addEventListener("input", ()=>{
renderPreview();
saveHistory();
});

function saveHistory(){
if(history[history.length - 1] !== editor.value){
history.push(editor.value);
historyIndex = history.length - 1;
}
}

function undo(){
if(historyIndex > 0){
historyIndex--;
editor.value = history[historyIndex];
renderPreview();
}
}

function redo(){
if(historyIndex < history.length - 1){
historyIndex++;
editor.value = history[historyIndex];
renderPreview();
}
}

function renderChat(){
messages.innerHTML = "";

chat.forEach(m=>{
const div = document.createElement("div");
div.className = "msg " + (m.user ? "user" : "ai");
div.textContent = m.text;
messages.appendChild(div);
});

messages.scrollTop = messages.scrollHeight;
localStorage.setItem("chat", JSON.stringify(chat));
}

function resetApp(){
chat = [];
editor.value = defaultHTML;
history = [];
historyIndex = -1;

saveHistory();
renderPreview();
renderChat();

localStorage.removeItem("chat");
localStorage.removeItem("html");
}

function shareHTML(){
navigator.clipboard.writeText(editor.value);
alert("HTMLコピーしました");
}

function extractHTML(text){
const m = text.match(/```html([\s\S]*?)```/);
return m ? m[1].trim() : null;
}

async function sendToGemini(){

if(!apiKey){
alert("APIキーを設定してください");
return;
}

const input = document.getElementById("chatInput");
const prompt = input.value.trim();
if(!prompt) return;

chat.push({ user:true, text:prompt });
renderChat();
input.value="";

chat.push({ user:false, text:"Geminiが考え中..." });
renderChat();

try{

const MAX_LEN = 8000;

const safeHTML =
editor.value.length > MAX_LEN
? editor.value.slice(0, MAX_LEN) + "\n...(省略)"
: editor.value;

const res = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({
contents:[{
role:"user",
parts:[{
text:`現在HTML:\n${safeHTML}\n\n指示:\n${prompt}`
}]
}],
systemInstruction:{
parts:[{
text:"HTML/CSS専門家。必ず完全HTMLを```html```で返す"
}]
}
})
}
);

if(!res.ok){
const text = await res.text();
throw new Error(text);
}

const data = await res.json();

chat.pop();

const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
const code = extractHTML(reply);

if(code){
editor.value = code;
renderPreview();
saveHistory();
chat.push({ user:false, text:"HTMLを更新しました" });
}else{
chat.push({ user:false, text:"HTML抽出に失敗しました" });
}

}catch(e){
chat.pop();
chat.push({
user:false,
text:"エラー:\n" + e.message
});
}

renderChat();
}

</script>

</body>
</html>
